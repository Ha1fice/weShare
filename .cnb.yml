# CNB 云原生构建流水线（cnb.cool）
#
# e2e（playwright）需要真浏览器。浏览器二进制与系统依赖用
# --with-deps 一次装齐，ms-playwright 目录挂 copy-on-write 卷：首次下载
# 后命中节点缓存；命中与否用目录存在性判断，输出可见，不静默。
#
# scripts/verify.mjs 的 e2e 步骤另有兜底：万一浏览器仍不可用，
# 该步骤会明确打印「跳过 + 原因」，绝不静默变绿。

#
# 与 GitHub Actions 跑同一套检查：`pnpm verify:full`
#   —— 仓库规范与护栏、类型检查、Lint、单元测试、e2e 真机链路、数据库迁移校验
#
# 镜像用 node:22（架构文档定的生产基线 LTS）；本地开发可以是更新的版本，
# 但 CI 必须锁在 LTS，避免"本地能跑、CI 挂"。
main:
  push:
    - name: 代码检查
      docker:
        image: node:22
        volumes:
          - /root/.cache/ms-playwright:copy-on-write
        volumes:
          # 缓存 playwright 浏览器（约 170MB）：首次下载，后续命中节点缓存
          - /root/.cache/ms-playwright:copy-on-write
      stages:
        - name: 准备 pnpm
          script:
            # 版本必须与根 package.json 的 packageManager 一致
            - corepack enable
            - corepack prepare pnpm@9.14.4 --activate
            - node -v
            - pnpm -v
        - name: 安装依赖
          script:
            - pnpm install --frozen-lockfile
            # e2e 真机链路需要真浏览器；--with-deps 连系统库一起装
            # （node:22 镜像没有 chromium 的运行库，缺了会 launch 崩）。
            # ms-playwright 目录挂了 copy-on-write 卷（见 docker.volumes），
            # 首次下载后命中节点缓存
            - if [ -n "$(ls -A /root/.cache/ms-playwright 2>/dev/null)" ]; then echo "命中浏览器缓存，跳过下载"; else pnpm exec playwright install --with-deps chromium; fi
        - name: 完整验证
          script:
            - pnpm verify:full

  pull_request:
    - name: PR 检查
      docker:
        image: node:22
        volumes:
          - /root/.cache/ms-playwright:copy-on-write
      stages:
        - name: 准备 pnpm
          script:
            - corepack enable
            - corepack prepare pnpm@9.14.4 --activate
        - name: 安装依赖
          script:
            - pnpm install --frozen-lockfile
        - name: 安装 playwright 浏览器（带缓存）
          script:
            - if [ -n "$(ls -A /root/.cache/ms-playwright 2>/dev/null)" ]; then echo "命中浏览器缓存，跳过下载"; else pnpm exec playwright install chromium; fi
        - name: 完整验证
          script:
            - pnpm verify:full

  # api_trigger：手动/程序化触发同一套完整验证，参数同 pull_request。
  # 用途：PR 分支上的收口提交在合并前也想跑一次全量检查。
  api_trigger:
    - name: 手动完整验证
      docker:
        image: node:22
        volumes:
          - /root/.cache/ms-playwright:copy-on-write
      stages:
        - name: 准备 pnpm
          script:
            - corepack enable
            - corepack prepare pnpm@9.14.4 --activate
        - name: 安装依赖
          script:
            - pnpm install --frozen-lockfile
        - name: 安装 playwright 浏览器（带缓存）
          script:
            - if [ -n "$(ls -A /root/.cache/ms-playwright 2>/dev/null)" ]; then echo "命中浏览器缓存，跳过下载"; else pnpm exec playwright install chromium; fi
        - name: 完整验证
          script:
            - pnpm verify:full

# 云原生开发环境：点仓库页面的「云原生开发」按钮时启动
$:
  vscode:
    - docker:
        image: node:22
      stages:
        - name: 准备开发环境
          script:
            - corepack enable
            - corepack prepare pnpm@9.14.4 --activate
            - pnpm install
